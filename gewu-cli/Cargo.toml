[package]
name = "gewu-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
gewu-core = { path = "../gewu-core" }
gewu-providers = { path = "../gewu-providers" }
gewu-tools = { path = "../gewu-tools" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
dotenvy = "0.15"
