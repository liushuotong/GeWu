<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeWu Chat</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #0d1117;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #c9d1d9;
        }
        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 { color: #58a6ff; margin: 0 0 20px 0; }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            background: #161b22;
            margin-bottom: 15px;
        }
        .message { margin-bottom: 12px; padding: 8px 12px; border-radius: 6px; }
        .message.user { background: #1f6feb22; border-left: 3px solid #58a6ff; }
        .message.assistant { background: #23863622; border-left: 3px solid #3fb950; }
        .message.tool { background: #f0883e22; border-left: 3px solid #f0883e; }
        .message.reasoning { background: #8b949e22; border-left: 3px solid #8b949e; font-style: italic; }
        .message .role { font-weight: bold; margin-right: 8px; }
        .message.user .role { color: #58a6ff; }
        .message.assistant .role { color: #3fb950; }
        .message.tool .role { color: #f0883e; }
        .message.reasoning .role { color: #8b949e; }
        .message .content { white-space: pre-wrap; word-break: break-word; }
        #input-container { display: flex; gap: 10px; }
        #message-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #30363d;
            border-radius: 6px;
            background: #0d1117;
            color: #c9d1d9;
            font-size: 14px;
            resize: none;
        }
        #message-input:focus { outline: none; border-color: #58a6ff; }
        #send-btn {
            padding: 12px 24px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        #send-btn:hover { background: #2ea043; }
        #send-btn:disabled { background: #484f58; cursor: not-allowed; }
        #session-info { color: #8b949e; margin-bottom: 10px; font-size: 14px; }
        .error { color: #f85149; background: #f8514922; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
        #new-session-btn {
            padding: 8px 16px;
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        #new-session-btn:hover { background: #30363d; }
    </style>
</head>
<body>
    <div id="app">
        <h1>GeWu Chat</h1>
        <div id="session-info">No session</div>
        <div id="chat-container"></div>
        <div id="error-container"></div>
        <div id="input-container">
            <textarea id="message-input" placeholder="Type your message..." rows="1"></textarea>
            <button id="send-btn">Send</button>
        </div>
        <div style="margin-top: 10px;">
            <button id="new-session-btn">New Session</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const sessionInfo = document.getElementById('session-info');
        const errorContainer = document.getElementById('error-container');
        const newSessionBtn = document.getElementById('new-session-btn');

        let token = '';
        let sessionId = null;
        let isLoading = false;

        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        token = urlParams.get('token') || '';

        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `<span class="role">${role}:</span><span class="content">${escapeHtml(content)}</span>`;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showError(msg) {
            errorContainer.innerHTML = `<div class="error">${escapeHtml(msg)}</div>`;
            setTimeout(() => errorContainer.innerHTML = '', 5000);
        }

        async function createSession(agentType = 'general') {
            try {
                const resp = await fetch(`/api/sessions?token=${encodeURIComponent(token)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ agent_type: agentType })
                });
                const data = await resp.json();
                sessionId = data.session.id;
                sessionInfo.textContent = `Session: ${sessionId.substring(0, 8)}... (${agentType})`;
                chatContainer.innerHTML = '';
                return true;
            } catch (e) {
                showError('Failed to create session: ' + e.message);
                return false;
            }
        }

        async function sendMessage() {
            if (isLoading || !sessionId) return;
            
            const message = messageInput.value.trim();
            if (!message) return;

            isLoading = true;
            sendBtn.disabled = true;
            messageInput.value = '';
            addMessage('user', message);

            try {
                const resp = await fetch(`/api/chat?token=${encodeURIComponent(token)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, message: message })
                });

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const event = JSON.parse(line.slice(6));
                                handleSSEEvent(event);
                            } catch (e) {}
                        }
                    }
                }
            } catch (e) {
                showError('Error: ' + e.message);
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
            }
        }

        let currentAssistantMsg = '';
        let currentReasoningMsg = '';

        function handleSSEEvent(event) {
            switch (event.type) {
                case 'reasoning_delta':
                    currentReasoningMsg += event.data.delta;
                    break;
                case 'content_delta':
                    currentAssistantMsg += event.data.delta;
                    break;
                case 'tool_start':
                    addMessage('tool', `Starting tool: ${event.data.tool}`);
                    break;
                case 'tool_finish':
                    addMessage('tool', `Tool finished: ${event.data.output}`);
                    break;
                case 'finish':
                    if (currentReasoningMsg) {
                        addMessage('reasoning', currentReasoningMsg);
                        currentReasoningMsg = '';
                    }
                    if (currentAssistantMsg) {
                        addMessage('assistant', currentAssistantMsg);
                        currentAssistantMsg = '';
                    }
                    break;
                case 'error':
                    showError(event.data.error);
                    break;
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        newSessionBtn.addEventListener('click', async () => {
            if (await createSession()) {
                addMessage('assistant', 'Session created. How can I help you?');
            }
        });

        // Auto-create session on load
        createSession().then(() => {
            addMessage('assistant', 'Session ready. How can I help you?');
        });
    </script>
</body>
</html>
