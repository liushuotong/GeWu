[package]
name = "gewu-lab"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0.0"
futures = "0.3"
gewu-core = { path = "../gewu-core" }
gewu-providers = { path = "../gewu-providers" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
glob = "0.3"
regex = "1.0"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-native-tls"] }
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
uuid = { version = "1.10", features = ["v4"] }

[[bin]]
name = "gewu-lab"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.10"
tower = { version = "0.5", features = ["util"] }
